<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Calculo de MAGE Spell Damage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .campo {
      flex: 1 1 calc(50% - 20px);
      min-width: 240px;
    }

    label {
      display: block;
      margin-top: 5px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 5px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 3px;
      text-align: center;
    }

    th {
      background-color: #333;
      color: white;
    }

    .mais-vantajoso {
      background-color: #a4dba4;
    }

    .mais-vantajoso-plus {
      background-color: #add8e6;
    }

    .nota {
      font-size: 0.9em;
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="topo">
  <h1>Calculo de MAGE Spell Damage</h1>
  <button onclick="gerarCalculos()">Calcular</button>
</div>

<form id="formDados" onsubmit="return false;">
  <div class="campo">
    <label for="lvl">LEVEL:</label>
    <input type="number" id="lvl" value="542" min="1" required />
  </div>

  <div class="campo">
    <label for="ml">ML:</label>
    <input type="number" id="ml" value="145" min="1" required />
  </div>
</form>

<div id="resultados" style="display:none;">
 <h1 style="text-align:center; margin-top: 5px; padding-top: 5px;">LISTA DE SPELLS</h1>
 <div id="resultadoTabela"></div>
</div>

<script>
  function gerarCalculos() {
  const lvl = parseInt(document.getElementById('lvl').value);
  const ml = parseInt(document.getElementById('ml').value);

  const calc = (x, y) => lvl * 0.2 + ml * x + y;

  // Avalanche
  const minAva = calc(1.2, 7);
  const maxAva = calc(2.8, 17);
  const medioAva = (minAva + maxAva) / 2;
  const medioAva5 = medioAva * 1.05;
  const medioAva10 = medioAva * 1.10;
  const medioAva20 = medioAva * 1.20;
  const danoPorLvl = 0.2;
  const danoPorMl = ((2.8 + 1.2) / 2);
  const lvlBonus = lvl * 1.25;
  const mlBonus = ml * 1.01;
  const medioBonus = ((lvlBonus * 0.2) + (mlBonus * ((1.2 + 2.8) / 2)) + ((7 + 17) / 2));

  // Thunder/Stone Shower
  const minTss = calc(1.0, 6);
  const maxTss = calc(2.6, 16);
  const medioTss = (minTss + maxTss) / 2;
  const medioTss5 = medioTss * 1.05;
  const medioTss10 = medioTss * 1.10;
  const medioTss20 = medioTss * 1.20;
  const medioTssBonus = ((lvlBonus * 0.2) + (mlBonus * ((1.0 + 2.6) / 2)) + ((6 + 16) / 2));
  const danoPorMlTss = ((2.6 + 1.0) / 2);


   // Sudden Death: fórmula (LVL * 0.2) + (ml * x) + y
  const minSD = lvl * 0.2 + ml * 4.605 + 28;
  const maxSD = lvl * 0.2 + ml * 7.395 + 46;
  const medioSD = (minSD + maxSD) / 2;

  const medioSD5 = medioSD * 1.05;
  const medioSD10 = medioSD * 1.10;
  const medioSD20 = medioSD * 1.20;

  const medioSDBonus = ((lvlBonus * 0.2) + (mlBonus * ((4.605 + 7.395) / 2)) + ((28 + 46) / 2));

  const danoPorMlSD = ((7.395 + 4.605) / 2);

  const arred = (n) => Math.round(n);
  const fix2 = (n) => n.toFixed(2);

  const tabela = `
    <table>
      <tr>
        <th>SPELL</th>
        <th>Mínimo</th>
        <th>Máximo</th>
        <th>Médio</th>
        <th>Médio 5%</th>
        <th>Médio 10%</th>
        <th>Médio 20%</th>
        <th>Médio em ${arred(lvlBonus)} / ${arred(mlBonus)}</th>
        <th>Dano por LVL</th>
        <th>Dano por ML</th>
      </tr>
      <tr>
        <td>Avalanche/GFB</td>
        <td>${arred(minAva)}</td>
        <td>${arred(maxAva)}</td>
        <td>${arred(medioAva)}</td>
        <td>${arred(medioAva5)}</td>
        <td>${arred(medioAva10)}</td>
        <td>${arred(medioAva20)}</td>
        <td>${arred(medioBonus)}</td>
        <td>${fix2(danoPorLvl)}</td>
        <td>${fix2(danoPorMl)}</td>
      </tr>
      <tr>
        <td>Thunder/Stone</td>
        <td>${arred(minTss)}</td>
        <td>${arred(maxTss)}</td>
        <td>${arred(medioTss)}</td>
        <td>${arred(medioTss5)}</td>
        <td>${arred(medioTss10)}</td>
        <td>${arred(medioTss20)}</td>
        <td>${arred(medioTssBonus)}</td>
        <td>${fix2(danoPorLvl)}</td>
        <td>${fix2(danoPorMlTss)}</td>
      </tr>
      <tr>
          <td>Sudden Death</td>
          <td>${arred(minSD)}</td>
          <td>${arred(maxSD)}</td>
          <td>${arred(medioSD)}</td>
          <td>${arred(medioSD5)}</td>
          <td>${arred(medioSD10)}</td>
          <td>${arred(medioSD20)}</td>
          <td>${arred(medioSDBonus)}</td>
          <td>${fix2(danoPorLvl)}</td>
          <td>${fix2(danoPorMlSD)}</td>
        </tr>
    </table>
  `;

  document.getElementById('resultados').style.display = 'block';
  document.getElementById('resultadoTabela').innerHTML = tabela;
}


  document.addEventListener('DOMContentLoaded', gerarCalculos);
</script>

</body>
</html>
